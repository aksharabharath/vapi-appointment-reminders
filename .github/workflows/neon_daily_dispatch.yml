name: Neon daily dispatch

# GitHub only runs `schedule` from the default branch (usually main).
# After merging this file to main, set repo secrets:
#   NEON_DISPATCH_URL  = https://vapi-appointment-reminders-git-dev-aksharabharath.vercel.app
#   CRON_SECRET        = same value as Vercel Preview CRON_SECRET
#   VERCEL_AUTOMATION_BYPASS_SECRET = Vercel Deployment Protection bypass (if SSO is on)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  daily-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel daily-dispatch
        env:
          NEON_DISPATCH_URL: ${{ secrets.NEON_DISPATCH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$NEON_DISPATCH_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing NEON_DISPATCH_URL or CRON_SECRET repo secrets."
            exit 1
          fi

          BASE="${NEON_DISPATCH_URL%/}"
          QUERY=""
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            QUERY="?force=1"
          fi

          HEADER_ARGS=(-H "Authorization: Bearer ${CRON_SECRET}" -H "Accept: application/json")
          if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            HEADER_ARGS+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi

          curl -fsS -X POST "${BASE}/api/cron/daily-dispatch${QUERY}" "${HEADER_ARGS[@]}"
