name: Dynamic Daily Automated Batch Appointment Calls

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-batch-calls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          # Token with write access to push DB updates back to main
          token: ${{ secrets.GITHUB_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run daily batch call script
        env:
          VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
          VAPI_PHONE_NUMBER_ID: ${{ secrets.VAPI_PHONE_NUMBER_ID }}
        run: |
          python run_daily_batch.py

      - name: Commit and push updated database back to repository
        if: always() # Run even if calls had partial failures
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add appointment_reminders.db || true
          git add call_history.db || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update DB after daily call batch [skip ci]" && git push origin main)