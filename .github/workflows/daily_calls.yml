name: Dynamic Daily Automated Batch Appointment Calls

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  run-batch-calls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run daily batch call script
        env:
          VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
          VAPI_PHONE_NUMBER_ID: ${{ secrets.VAPI_PHONE_NUMBER_ID }}
        run: |
          python run_daily_batch.py

      - name: Commit and push updated database
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add appointment_reminders.db || true
          git add call_history.db || true

          if ! git diff --staged --quiet; then
            git commit -m "Auto-update database after daily call batch [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No database changes to commit."
          fi
