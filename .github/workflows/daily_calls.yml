name: Dynamic Daily Automated Batch Appointment Calls

on:
  schedule:
    # Runs every 10 minutes to match PST schedule triggers
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-batch-calls:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          # Uses PAT token with write access to push DB updates back to main
          token: ${{ secrets.GITHUB_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run daily batch call script
        env:
          VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
          VAPI_PHONE_NUMBER_ID: ${{ secrets.VAPI_PHONE_NUMBER_ID }}
        run: |
          python run_daily_batch.py

      - name: Commit and push updated database to repository
        if: always() # Executes even if there were call script warnings
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stage database files if modified
          git add appointment_reminders.db || true
          git add call_history.db || true

          # Check for staged changes and push safely
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update database after daily call batch [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No database changes to commit."
          fi