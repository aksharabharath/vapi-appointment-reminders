name: Dynamic Daily Automated Batch Appointment Calls

on:
  repository_dispatch:
    types: [trigger_vapi_calls]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-batch-calls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Batch Call Automation
        env:
          VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
          VAPI_PHONE_NUMBER_ID: ${{ secrets.VAPI_PHONE_NUMBER_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          python run_daily_batch.py

      - name: Commit & Push Updated Database Back to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add patients.db
          git diff-index --quiet HEAD || (git pull origin main --rebase && git commit -m "DB: Auto-update call attempts from daily batch run [skip ci]" && git push origin main)