name: Daily 9:30 AM Pacific Batch Appointment Calls

on:
  schedule:
    # 9:30 AM Pacific Time (16:30 UTC during Daylight Saving Time)
    - cron: '30 16 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  run-batch-calls:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Daily Batch Call Automation
        env:
          VAPI_API_KEY: ${{ secrets.VAPI_API_KEY }}
          VAPI_PHONE_NUMBER_ID: ${{ secrets.VAPI_PHONE_NUMBER_ID }}
        run: |
          python run_daily_batch.py